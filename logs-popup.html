<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>FocusMan - Logs</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Courier New', monospace;
        background: #1e1e1e;
        color: #d4d4d4;
        width: 600px;
        max-height: 500px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 12px;
        font-weight: bold;
        font-size: 14px;
        text-align: center;
        border-bottom: 2px solid #764ba2;
      }

      .logs-container {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        background: #1e1e1e;
      }

      .log-entry {
        padding: 6px 8px;
        margin-bottom: 4px;
        background: #252526;
        border-left: 3px solid #007ACC;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .log-entry:hover {
        background: #2d2d30;
        border-left-color: #0098ff;
      }

      .time {
        color: #858585;
      }

      .message {
        color: #d4d4d4;
      }

      .footer {
        background: #252526;
        padding: 8px;
        border-top: 1px solid #3e3e42;
        display: flex;
        gap: 8px;
      }

      button {
        flex: 1;
        padding: 8px 12px;
        background: #0e639c;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
      }

      button:hover {
        background: #1177bb;
      }

      button:active {
        background: #0e639c;
      }

      .empty {
        color: #6a9955;
        text-align: center;
        padding: 20px;
        font-style: italic;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      ::-webkit-scrollbar-thumb {
        background: #464647;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #5a5a5a;
      }
    </style>
</head>
<body>
    <div class="header">📋 FocusMan Logs</div>
    <div class="logs-container" id="logs-list">
        <div class="empty">Cargando logs...</div>
    </div>
    <div class="footer">
        <button id="refresh-btn">🔄 Actualizar</button>
        <button id="clear-btn">🗑️ Limpiar</button>
    </div>

    <script src="logs-popup.js"></script>
</body>
</html>
