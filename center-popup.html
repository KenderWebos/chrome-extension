<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mac-like Search</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .search-container {
            background: rgba(255, 255, 255, 0.7); /* Añadida transparencia */
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            width: 400px;
            max-width: 90%;
        }
        .search-icon {
            color: #666;
            margin-right: 10px;
            font-size: 18px;
        }
        .search-input {
            border: none;
            background: transparent;
            font-size: 18px;
            color: #333;
            width: 100%;
            outline: none;
            font-weight: 400;
        }
        .search-input::placeholder {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="Search...">
    </div>
</body>
</html>
